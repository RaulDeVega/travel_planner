<!DOCTYPE html>
<html lang="es">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="/static/css/login.css">

</head>
<body>

  <main>
    <form id="formulario">
      <h1>Iniciar sesión</h1>

      <div class="form-group">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-input"
               placeholder="correo" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" class="form-input"
               placeholder="contraseña" required>
      </div>

      <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>

      <button type="submit" id="boton">Entrar</button>
    </form>
  </main>

  <script>
    // TODO:  Cambiar por la URL del servidor
    const API_URL = "/api/login";

    const formulario = document.getElementById("formulario");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("boton");

    formulario.addEventListener("submit", async function(event) {
      event.preventDefault();
      mensaje.textContent = "";

      // Datos pedidos al usuario
      const email = formulario.email.value.trim();
      const password = formulario.password.value;

      if (!email || !password) {
        mensaje.textContent = "Introduce tu correo y tu contraseña.";
        return;
      }

      boton.disabled = true;
      boton.textContent = "Entrando...";

      try {
        // Envío de los datos como JSON
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        // El servidor responde también con JSON
        const data = await response.json();

        // Error
        if (!response.ok) {
          mensaje.textContent = data.error || "No se pudo iniciar sesión.";
          return;
        }

        // Ejemplo: guardar el token y redirigir
        // localStorage.setItem("token", data.token);
        window.location.href = "/dashboard.html";
      } catch (error) {
        mensaje.textContent = "No se pudo conectar con el servidor.";
      } finally {
        boton.disabled = false;
        boton.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
