<!DOCTYPE html>
<html lang="es">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <!-- He descomentado tu CSS para que recupere el estilo -->
  <link rel="stylesheet" href="cssprueba.css">
</head>
<body>

  <main>
    <form id="formulario">
      <h1>Crear cuenta</h1>

      <!-- Contenedor de la foto de perfil -->
      <div class="contenedor-perfil" style="text-align: center; margin-bottom: 20px;">
        <input type="file" id="subir-foto" name="foto_perfil" accept="image/*" style="display: none;">
        
        <label for="subir-foto" class="boton-imagen" style="cursor: pointer;">
            <figure class="avatar" style="margin: 0;">
                <img src="fotoDePerfil.jpeg" id="vista-previa" alt="Tu foto de perfil" style="width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 2px solid #ccc;">
            </figure>
        </label>
      </div>

      <div class="form-group">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" name="nombre" class="form-input" placeholder="nombre" required>
      </div>

      <div class="form-group">
        <label for="apellidos" class="form-label">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" class="form-input" placeholder="apellidos" required>
      </div>

      <div class="form-group">
        <label for="nombre_de_usuario" class="form-label">Nombre de Usuario</label>
        <input type="text" id="nombre_de_usuario" name="nombre_de_usuario" class="form-input" placeholder="nombre_de_usuario" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="correo" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="contraseña" required>
      </div>

      <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>

      <button type="submit" id="boton">Entrar</button><br>

      <a href="login" class="link-registro">Ya tienes cuenta?</a>
    </form>
  </main>

  <script>
    // ==========================================
    // 1. LÓGICA PARA LA VISTA PREVIA DE LA FOTO
    // ==========================================
    const inputFoto = document.getElementById('subir-foto');
    const imagenPrevia = document.getElementById('vista-previa');

    inputFoto.addEventListener('change', function(evento) {
        const archivo = evento.target.files[0];
        if (archivo) {
            const urlTemporal = URL.createObjectURL(archivo);
            imagenPrevia.src = urlTemporal;
        }
    });

    // ==========================================
    // 2. LÓGICA ORIGINAL DEL FORMULARIO (LOGIN)
    // ==========================================
const API_URL = "/api/register";
    const formulario = document.getElementById("formulario");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("boton");

    formulario.addEventListener("submit", async function(event) {
      event.preventDefault();
      mensaje.textContent = "";

      // Usar FormData recopila automáticamente los inputs y el archivo subido
      const formData = new FormData(formulario);

      boton.disabled = true;
      boton.textContent = "Registrando...";

      try {
        // Al enviar FormData con fetch, NO se pone header Content-Type (el navegador lo añade con el boundary)
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          mensaje.textContent = data.error || "No se pudo registrar la cuenta.";
          return;
        }

        // Registro exitoso: redirige al inicio de sesión
        alert("Cuenta creada con éxito. Inicia sesión para continuar.");
        window.location.href = "/login";

      } catch (error) {
        mensaje.textContent = "No se pudo conectar con el servidor.";
      } finally {
        boton.disabled = false;
        boton.textContent = "Registrarse";
      }
    });
  </script>
</body>
</html>
